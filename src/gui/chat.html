<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Agent Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--vscode-editor-background, #0d1117);
            color: var(--vscode-editor-foreground, #c9d1d9);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--vscode-sideBar-background, #0d1117);
            padding: 12px 16px;
            border-bottom: 1px solid var(--vscode-editorWidget-border, #30363d);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            color: var(--vscode-button-background, #d2a8ff);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-controls { display: flex; gap: 8px; }

        .header-controls button {
            background: var(--vscode-button-background, #007bff);
            border: 1px solid var(--vscode-button-hoverBackground, #0056b3);
            color: var(--vscode-button-foreground, white);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: opacity 0.15s ease;
        }

        .header-controls button:hover { opacity: 0.8; }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 800px;
            width: 100%;
            padding: 14px 18px;
            border-radius: 8px;
            line-height: 1.6;
            background: var(--vscode-textBlockQuote-background, #848686);
            border: 1px solid var(--vscode-editorWidget-border, #30363d);
            color: var(--vscode-editor-foreground, white);
        }

        .message.user { align-self: flex-end; }
        .message.assistant { align-self: flex-start; }
        .message.system {
            align-self: center;
            font-size: 13px;
            text-align: center;
            padding: 10px 20px;
        }

        .message pre {
            background: var(--vscode-textPreformat-background, #0d1117);
            padding: 14px;
            border-radius: 6px;
            overflow-x: auto;
            margin-top: 10px;
            border: 1px solid var(--vscode-editorWidget-border, #30363d);
        }

        .message pre code {
            font-family: Consolas, Monaco, 'Courier New', monospace;
            font-size: 13px;
        }

        .message code {
            font-family: Consolas, Monaco, 'Courier New', monospace;
            font-size: 13px;
            padding: 2px 4px;
            background: var(--vscode-textPreformat-background, rgba(255,255,255,0.1));
            border-radius: 3px;
        }

        .message h1, .message h2, .message h3 { margin: 8px 0 4px; line-height: 1.3; }
        .message ul, .message ol { padding-left: 24px; margin: 8px 0; }

        .input-container {
            background: var(--vscode-sideBar-background, #0d1117);
            padding: 14px;
            border-top: 1px solid var(--vscode-editorWidget-border, #30363d);
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .input-container textarea {
            flex: 1;
            background: var(--vscode-input-background, #0d1117);
            border: 1px solid var(--vscode-input-border, #30363d);
            border-radius: 6px;
            padding: 12px;
            color: var(--vscode-input-foreground, #c9d1d9);
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            min-height: 60px;
            max-height: 200px;
            transition: border-color 0.15s ease;
        }

        .input-container textarea:focus {
            outline: none;
            border-color: var(--vscode-focusBorder, #d2a8ff);
        }

        .input-container textarea::placeholder {
            color: var(--vscode-input-placeholderForeground, #8b949e);
        }

        .input-container button {
            background: var(--vscode-button-background, #007bff);
            border: none;
            color: var(--vscode-button-foreground, white);
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.15s ease;
            white-space: nowrap;
        }

        .input-container button:hover { opacity: 0.8; }
        .input-container button:disabled { opacity: 0.4; cursor: not-allowed; }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--vscode-editorWidget-border, #6e7681);
            border-radius: 50%;
            border-top-color: var(--vscode-button-background, #d2a8ff);
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .scrollbar-v {
            scrollbar-width: thin;
            scrollbar-color: var(--vscode-scrollbarSlider-background, #454545) var(--vscode-scrollbarSlider-hoverBackground, #1e1e1e);
        }

        .scrollbar-v::-webkit-scrollbar { width: 8px; }
        .scrollbar-v::-webkit-scrollbar-track { background: var(--vscode-scrollbarSlider-hoverBackground, #1e1e1e); }
        .scrollbar-v::-webkit-scrollbar-thumb { background: var(--vscode-scrollbarSlider-background, #454545); border-radius: 4px; }
        .scrollbar-v::-webkit-scrollbar-thumb:hover { background: var(--vscode-scrollbarSlider-activeBackground, #d2a8ff); }

        .code-actions { display: flex; gap: 4px; margin-top: 8px; }
        .code-actions button {
            background: var(--vscode-button-secondaryBackground, #21262d);
            border: 1px solid var(--vscode-button-secondaryBorder, #30363d);
            color: var(--vscode-button-secondaryForeground, #c9d1d9);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .code-actions button:hover { background: var(--vscode-button-secondaryHoverBackground, #30363d); }
    </style>
</head>
<body>
    <div class="header">
        <h1>Ollama AI Assistant</h1>
        <div class="header-controls">
            <button id="closeBtn">Close Panel</button>
        </div>
    </div>

    <div class="chat-container scrollbar-v" id="chatContainer">
        <div class="message system">
            Ollama Agent is ready. Select a model and start chatting!
        </div>
    </div>

    <div class="input-container">
        <textarea id="messageInput" placeholder="Ask Ollama anything... (Enter to send, Shift+Enter for new line)" rows="2"></textarea>
        <button id="sendBtn" disabled>Send</button>
    </div>

    <script>
        (function() {
            const vscode = acquireVsCodeApi();
            const chatContainer = document.getElementById('chatContainer');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const closeBtn = document.getElementById('closeBtn');

            let isGenerating = false;
            let serverUrl = 'http://localhost:11434';
            let defaultModel = 'llama3.2';

            const state = vscode.getState();
            if (state) {
                serverUrl = state.serverUrl || serverUrl;
                defaultModel = state.defaultModel || defaultModel;
            }

            function escapeHtml(text) {
                return text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function renderMarkdown(text) {
                const codeBlocks = [];
                const placeholder = '\u00a4\u00a4CODE\u00a4\u00a4';

                text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
                    codeBlocks.push({ lang, code });
                    return placeholder + (codeBlocks.length - 1) + placeholder;
                });

                let html = escapeHtml(text);

                html = html.replace(/^###### (.*)$/gm, '<h6>$1</h6>');
                html = html.replace(/^##### (.*)$/gm, '<h5>$1</h5>');
                html = html.replace(/^#### (.*)$/gm, '<h4>$1</h4>');
                html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
                html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
                html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');
                html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
                html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
                html = html.replace(/\n/g, '<br>');

                html = html.replace(/\u00a4\u00a4CODE\u00a4\u00a4(\d+)\u00a4\u00a4/g, (_, idx) => {
                    const block = codeBlocks[parseInt(idx, 10)];
                    const langClass = block.lang ? ' class="language-' + escapeHtml(block.lang) + '"' : '';
                    return '<pre><code' + langClass + '>' + escapeHtml(block.code) + '</code></pre>';
                });

                return html;
            }

            function addMessage(role, content) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message ' + role;
                if (role === 'assistant' || role === 'system') {
                    messageDiv.innerHTML = renderMarkdown(content);
                } else {
                    messageDiv.textContent = content;
                }
                chatContainer.appendChild(messageDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            function addLoading() {
                const id = 'loading-' + Date.now();
                const div = document.createElement('div');
                div.className = 'message assistant';
                div.id = id;
                div.innerHTML = '<span class="loading"></span>Thinking...';
                chatContainer.appendChild(div);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                return id;
            }

            function removeLoading(id) {
                const el = document.getElementById(id);
                if (el) el.remove();
            }

            async function sendMessage() {
                const message = messageInput.value.trim();
                if (!message || isGenerating) return;

                isGenerating = true;
                messageInput.disabled = true;
                sendBtn.disabled = true;
                addMessage('user', message);
                messageInput.value = '';
                const loadingId = addLoading();

                try {
                    const response = await fetch(serverUrl + '/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: defaultModel,
                            messages: [{ role: 'user', content: message }],
                            stream: false
                        })
                    });

                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status + ': ' + response.statusText);
                    }

                    const data = await response.json();
                    removeLoading(loadingId);
                    addMessage('assistant', data.message && data.message.content || data.response || 'No response from Ollama');
                } catch (error) {
                    removeLoading(loadingId);
                    addMessage('system', 'Error: ' + (error.message || error) + '. Make sure Ollama server is running at ' + serverUrl);
                } finally {
                    isGenerating = false;
                    messageInput.disabled = false;
                    sendBtn.disabled = !messageInput.value.trim();
                    messageInput.focus();
                }
            }

            sendBtn.addEventListener('click', sendMessage);

            messageInput.addEventListener('input', () => {
                sendBtn.disabled = !messageInput.value.trim();
            });

            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    vscode.postMessage({ command: 'closePanel' });
                });
            }

            window.addEventListener('message', (event) => {
                const msg = event.data;
                switch (msg.type) {
                    case 'config':
                        if (msg.serverUrl) serverUrl = msg.serverUrl;
                        if (msg.defaultModel) defaultModel = msg.defaultModel;
                        vscode.setState({ serverUrl, defaultModel });
                        break;
                    case 'result':
                        if (msg.text) {
                            addMessage('assistant', msg.text);
                        }
                        break;
                }
            });
        })();
    </script>
</body>
</html>
