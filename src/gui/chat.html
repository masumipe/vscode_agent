<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Agent Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #0d1117;
            padding: 12px 16px;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #d2a8ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-controls {
            display: flex;
            gap: 8px;
        }

        .header-controls button {
            background: #007bff;
            border: 1px solid #0056b3;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.15s ease;
        }

        .header-controls button:hover {
            background: #0056b3;
            color: white;
            border-color: #007bff;
        }

        .header-controls button:active {
            background: #004a9e;
            border-color: #0056b3;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 800px;
            width: 100%;
            padding: 14px 18px;
            border-radius: 8px;
            line-height: 1.6;
            background: #848686;
            border: 1px solid #30363d;
            color: white;
        }

        .message.user {
            align-self: flex-end;
            background: #848686;
            color: white;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message.system {
            align-self: center;
            background: #848686;
            color: white;
            font-size: 13px;
            text-align: center;
            padding: 10px 20px;
        }

        .message pre {
            background: #0d1117;
            padding: 14px;
            border-radius: 6px;
            overflow-x: auto;
            margin-top: 10px;
            border: 1px solid #30363d;
        }

        .message pre code {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            color: #d2a8ff;
        }

        .input-container {
            background: #0d1117;
            padding: 14px;
            border-top: 1px solid #30363d;
        }

        .input-container textarea {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            min-height: 60px;
            max-height: 200px;
            transition: border-color 0.15s ease;
        }

        .input-container textarea:focus {
            outline: none;
            border-color: #d2a8ff;
        }

        .input-container textarea::placeholder {
            color: #8b949e;
        }

        .input-container button {
            margin-top: 10px;
            background: #007bff;
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.15s ease;
        }

        .input-container button:hover {
            background: #6d7170;
        }

        .input-container button:disabled {
            background: #5a5c5b;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .model-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #848686;
            border-radius: 6px;
            margin-bottom: 12px;
            border: 1px solid #30363d;
            color: white;
        }

        .model-selector select {
            background: #848686;
            border: 1px solid #30363d;
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: border-color 0.15s ease;
        }

        .model-selector select:focus {
            outline: none;
            border-color: #ffffff;
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #6e7681;
            border-radius: 50%;
            border-top-color: #d2a8ff;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .scrollbar-v {
            scrollbar-width: thin;
            scrollbar-color: #454545 #1e1e1e;
        }

        .scrollbar-v::-webkit-scrollbar {
            width: 8px;
        }

        .scrollbar-v::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        .scrollbar-v::-webkit-scrollbar-thumb {
            background: #454545;
            border-radius: 4px;
        }

        .scrollbar-v::-webkit-scrollbar-thumb:hover {
            background: #d2a8ff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 Ollama Agent</h1>
        <div class="header-controls">
            <button id="closeBtn">Close Panel</button>
            <button id="fileExplorerBtn">📁 Files</button>
        </div>
    </div>

    <div id="fileExplorer" class="hidden" style="display: none; padding: 16px;">
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <input type="text" id="searchPath" placeholder="Search files..." style="flex: 1; padding: 10px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9;">
            <button id="refreshBtn" style="padding: 10px 14px; background: #161b22; border: 1px solid #30363d; color: #8b949e; border-radius: 6px; cursor: pointer;">🔄</button>
        </div>
        <div id="fileList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px;"></div>
    </div>

    <div class="chat-container scrollbar-v" id="chatContainer">
        <div class="message system">
            Ollama Agent is ready. Select a model and start chatting!
        </div>
    </div>

    <div class="model-selector">
        <label for="modelSelect">Model:</label>
        <select id="modelSelect">
            <option value="llama3.2">llama3.2</option>
            <option value="llama3.1">llama3.1</option>
            <option value="mistral">mistral</option>
            <option value="codellama">codellama</option>
        </select>
    </div>

    <div class="input-container">
        <textarea id="messageInput" placeholder="Ask Ollama anything... (Shift+Enter for new line, Enter to send)"></textarea>
        <button id="sendBtn" disabled>Send</button>
    </div>

    <div style="padding: 10px 16px; background: #0d1117; border-top: 1px solid #30363d;">
        <div style="display: flex; gap: 8px;">
            <button id="insertBtn" style="padding: 8px 16px; background: #848686; border: none; color: white; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: background 0.15s ease;">📝 Insert Code</button>
            <button id="editBtn" style="padding: 8px 16px; background: #848686; border: none; color: white; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: background 0.15s ease;">✏️ Edit Code</button>
            <button id="deleteBtn" style="padding: 8px 16px; background: #848686; border: none; color: white; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: background 0.15s ease;">🗑️ Delete Code</button>
            <button id="explainBtn" style="padding: 8px 16px; background: #848686; border: none; color: white; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: background 0.15s ease;">💡 Explain</button>
        </div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const modelSelect = document.getElementById('modelSelect');
        const closeBtn = document.getElementById('closeBtn');

        let isGenerating = false;

        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            if (role === 'assistant') {
                messageDiv.innerHTML = parseMarkdown(content);
            } else {
                messageDiv.textContent = content;
            }
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addLoading() {
            const loadingId = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.id = loadingId;
            loadingDiv.innerHTML = '<span class="loading"></span>Thinking...';
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return loadingId;
        }

        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function parseMarkdown(text) {
            return text
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/gim, '<em>$1</em>')
                .replace(/`([^`]+)`/gim, '<code>$1</code>')
                .replace(/```([\s\S]*?)```/gim, '<pre><code>$1</code></pre>')
                .replace(/\n/gim, '<br>');
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isGenerating) return;

            isGenerating = true;
            messageInput.disabled = true;
            sendBtn.disabled = true;
            addMessage('user', message);
            messageInput.value = '';
            const loadingId = addLoading();

            try {
                const response = await fetch('http://localhost:11434/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: modelSelect.value,
                        messages: [{ role: 'user', content: message }],
                        stream: false
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                removeLoading(loadingId);
                addMessage('assistant', data.message?.content || data.response || 'No response from Ollama');
            } catch (error) {
                removeLoading(loadingId);
                addMessage('system', `Error sending message: ${error.message || error}`);
            } finally {
                isGenerating = false;
                messageInput.disabled = false;
                sendBtn.disabled = !messageInput.value.trim();
                messageInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('input', () => {
            sendBtn.disabled = !messageInput.value.trim();
        });
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        if (closeBtn) {
            closeBtn.addEventListener('click', () => {
                vscode.postMessage({ command: 'closePanel' });
            });
        }
    </script>
</body>
</html>
