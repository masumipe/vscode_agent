<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Agent Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--vscode-editor-background, #0d1117);
            color: var(--vscode-editor-foreground, #c9d1d9);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--vscode-sideBar-background, #0d1117);
            padding: 12px 16px;
            border-bottom: 1px solid var(--vscode-editorWidget-border, #30363d);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            color: var(--vscode-button-background, #d2a8ff);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header .subtitle {
            font-size: 12px;
            font-style: italic;
            font-weight: 400;
            color: var(--vscode-descriptionForeground, #8b949e);
        }

        .header-controls { display: flex; gap: 8px; }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 800px;
            width: 100%;
            padding: 14px 18px;
            border-radius: 8px;
            line-height: 1.6;
            background: var(--vscode-textBlockQuote-background, #848686);
            border: 1px solid var(--vscode-editorWidget-border, #30363d);
            color: var(--vscode-editor-foreground, white);
        }

        .message.user { align-self: flex-end; }
        .message.assistant { align-self: flex-start; }
        .message.system {
            align-self: center;
            font-size: 13px;
            text-align: center;
            padding: 10px 20px;
        }

        .message pre {
            background: var(--vscode-textPreformat-background, #0d1117);
            padding: 14px;
            border-radius: 6px;
            overflow-x: auto;
            margin-top: 10px;
            border: 1px solid var(--vscode-editorWidget-border, #30363d);
            position: relative;
        }

        .message pre code {
            font-family: Consolas, Monaco, 'Courier New', monospace;
            font-size: 13px;
        }

        .message code {
            font-family: Consolas, Monaco, 'Courier New', monospace;
            font-size: 13px;
            padding: 2px 4px;
            background: var(--vscode-textPreformat-background, rgba(255,255,255,0.1));
            border-radius: 3px;
        }

        .message h1, .message h2, .message h3 { margin: 8px 0 4px; line-height: 1.3; }
        .message ul, .message ol { padding-left: 24px; margin: 8px 0; }

        .code-wrapper {
            position: relative;
            margin-top: 10px;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--vscode-textPreformat-background, #0d1117);
            border: 1px solid var(--vscode-editorWidget-border, #30363d);
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            padding: 6px 12px;
            font-size: 12px;
            color: var(--vscode-descriptionForeground, #8b949e);
        }

        .code-header .lang-label {
            font-weight: 500;
        }

        .code-header .copy-btn {
            background: transparent;
            border: 1px solid var(--vscode-editorWidget-border, #30363d);
            color: var(--vscode-editor-foreground, #c9d1d9);
            padding: 2px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: background 0.15s;
        }

        .code-header .copy-btn:hover {
            background: var(--vscode-button-hoverBackground, #0056b3);
            color: white;
        }

        .code-header .copy-btn.copied {
            background: var(--vscode-testing-iconPassed, #2ea043);
            color: white;
            border-color: var(--vscode-testing-iconPassed, #2ea043);
        }

        .code-wrapper pre {
            margin-top: 0;
            border-radius: 0 0 6px 6px;
        }

        /* Change notification card */
        .change-card {
            max-width: 800px;
            width: 100%;
            background: var(--vscode-sideBar-background, #0d1117);
            border: 1px solid var(--vscode-editorWidget-border, #30363d);
            border-radius: 8px;
            padding: 16px;
            align-self: flex-start;
        }

        .change-card .change-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .change-card .change-header .file-icon {
            font-size: 16px;
        }

        .change-card .change-header .file-link {
            color: var(--vscode-textLink-foreground, #58a6ff);
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
        }

        .change-card .change-header .file-link:hover {
            text-decoration: underline;
        }

        .change-card .change-header .file-link .modifier {
            color: var(--vscode-descriptionForeground, #8b949e);
            font-weight: normal;
            font-size: 12px;
        }

        .change-card .change-actions {
            display: flex;
            gap: 8px;
        }

        .change-card .change-actions button {
            padding: 6px 18px;
            border-radius: 6px;
            border: 1px solid transparent;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: opacity 0.15s;
        }

        .change-card .change-actions button:hover { opacity: 0.85; }

        .change-card .change-actions .btn-accept {
            background: var(--vscode-testing-iconPassed, #2ea043);
            color: white;
        }

        .change-card .change-actions .btn-reject {
            background: var(--vscode-testing-iconFailed, #f85149);
            color: white;
        }

        .change-card .change-actions .btn-accept:disabled,
        .change-card .change-actions .btn-reject:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .input-container {
            background: var(--vscode-sideBar-background, #0d1117);
            padding: 14px;
            border-top: 1px solid var(--vscode-editorWidget-border, #30363d);
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .input-container textarea {
            flex: 1;
            background: var(--vscode-input-background, #0d1117);
            border: 1px solid var(--vscode-input-border, #30363d);
            border-radius: 6px;
            padding: 12px;
            color: var(--vscode-input-foreground, #c9d1d9);
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            min-height: 60px;
            max-height: 200px;
            transition: border-color 0.15s ease;
        }

        .input-container textarea:focus {
            outline: none;
            border-color: var(--vscode-focusBorder, #d2a8ff);
        }

        .input-container textarea::placeholder {
            color: var(--vscode-input-placeholderForeground, #8b949e);
        }

        .input-container button {
            background: var(--vscode-button-background, #007bff);
            border: none;
            color: var(--vscode-button-foreground, white);
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.15s ease;
            white-space: nowrap;
        }

        .input-container button:hover { opacity: 0.8; }
        .input-container button:disabled { opacity: 0.4; cursor: not-allowed; }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--vscode-editorWidget-border, #6e7681);
            border-radius: 50%;
            border-top-color: var(--vscode-button-background, #d2a8ff);
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .scrollbar-v {
            scrollbar-width: thin;
            scrollbar-color: var(--vscode-scrollbarSlider-background, #454545) var(--vscode-scrollbarSlider-hoverBackground, #1e1e1e);
        }

        .scrollbar-v::-webkit-scrollbar { width: 8px; }
        .scrollbar-v::-webkit-scrollbar-track { background: var(--vscode-scrollbarSlider-hoverBackground, #1e1e1e); }
        .scrollbar-v::-webkit-scrollbar-thumb { background: var(--vscode-scrollbarSlider-background, #454545); border-radius: 4px; }
        .scrollbar-v::-webkit-scrollbar-thumb:hover { background: var(--vscode-scrollbarSlider-activeBackground, #d2a8ff); }
    </style>
</head>
<body>
    <div class="header">
        <h1>Ollama AI Assistant <span class="subtitle">(Ollama Agent is ready. Select a model and start chatting!)</span></h1>
        <div class="header-controls"></div>
    </div>

    <div class="chat-container scrollbar-v" id="chatContainer"></div>

    <div class="input-container">
        <textarea id="messageInput" placeholder="Ask Ollama anything... (Enter to send, Shift+Enter for new line)" rows="2"></textarea>
        <button id="sendBtn" disabled>Send</button>
    </div>

    <script>
        (function() {
            const vscode = acquireVsCodeApi();
            const chatContainer = document.getElementById('chatContainer');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');

            let isGenerating = false;
            let serverUrl = 'http://localhost:11434';
            let defaultModel = 'llama3.2';

            const state = vscode.getState();
            if (state) {
                serverUrl = state.serverUrl || serverUrl;
                defaultModel = state.defaultModel || defaultModel;
            }

            // ---- Helpers ----

            function escapeHtml(text) {
                return text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function scrollBottom() {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            // ---- Code copy ----

            function makeCopyHandler(btn, codeText) {
                return function() {
                    navigator.clipboard.writeText(codeText).then(() => {
                        btn.textContent = 'Copied';
                        btn.classList.add('copied');
                        setTimeout(() => {
                            btn.textContent = 'Copy';
                            btn.classList.remove('copied');
                        }, 2000);
                    }).catch(() => {
                        btn.textContent = 'Failed';
                    });
                };
            }

            // ---- Markdown renderer with copy buttons ----

            function renderMarkdown(text) {
                const codeBlocks = [];
                const placeholder = '\u00a4\u00a4CODE\u00a4\u00a4';

                text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
                    codeBlocks.push({ lang: lang || 'text', code });
                    return placeholder + (codeBlocks.length - 1) + placeholder;
                });

                let html = escapeHtml(text);

                html = html.replace(/^###### (.*)$/gm, '<h6>$1</h6>');
                html = html.replace(/^##### (.*)$/gm, '<h5>$1</h5>');
                html = html.replace(/^#### (.*)$/gm, '<h4>$1</h4>');
                html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
                html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
                html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');
                html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
                html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
                html = html.replace(/\n/g, '<br>');

                html = html.replace(/\u00a4\u00a4CODE\u00a4\u00a4(\d+)\u00a4\u00a4/g, (_, idx) => {
                    const block = codeBlocks[parseInt(idx, 10)];
                    const langClass = block.lang ? ' class="language-' + escapeHtml(block.lang) + '"' : '';
                    const escapedCode = escapeHtml(block.code);
                    const escapedLang = escapeHtml(block.lang);
                    return (
                        '<div class="code-wrapper">' +
                        '<div class="code-header">' +
                        '<span class="lang-label">' + escapedLang + '</span>' +
                        '<button class="copy-btn" data-code-idx="' + idx + '">Copy</button>' +
                        '</div>' +
                        '<pre><code' + langClass + '>' + escapedCode + '</code></pre>' +
                        '</div>'
                    );
                });

                return html;
            }

            function attachCopyHandlers(container) {
                container.querySelectorAll('.copy-btn[data-code-idx]').forEach(btn => {
                    const idx = parseInt(btn.getAttribute('data-code-idx'), 10);
                    // code blocks are re-parsed, we store the text in a data attribute
                    // instead, use the actual code from the pre following the header
                    const pre = btn.closest('.code-wrapper').querySelector('pre code');
                    if (pre) {
                        const codeText = pre.textContent || '';
                        btn.removeEventListener('click', btn._copyHandler);
                        btn._copyHandler = makeCopyHandler(btn, codeText);
                        btn.addEventListener('click', btn._copyHandler);
                    }
                });
            }

            // ---- Change notification UI ----

            function addChangeNotification(data) {
                const card = document.createElement('div');
                card.className = 'change-card';
                card.dataset.changePath = data.filePath;
                card.dataset.changeIndex = data.changeIndex;

                const linesLabel = data.linesChanged + ' line' + (data.linesChanged !== 1 ? 's' : '');
                const blocksLabel = data.blocks + ' block' + (data.blocks !== 1 ? 's' : '');

                card.innerHTML =
                    '<div class="change-header">' +
                        '<span class="file-icon">\u{1F4C4}</span>' +
                        '<span class="file-link" data-path="' + escapeHtml(data.filePath) + '">' +
                            escapeHtml(data.fileName) +
                            ' <span class="modifier">(' + linesLabel + ', ' + blocksLabel + ')</span>' +
                        '</span>' +
                    '</div>' +
                    '<div class="change-actions">' +
                        '<button class="btn-accept" data-path="' + escapeHtml(data.filePath) + '">\u2713 Accept</button>' +
                        '<button class="btn-reject" data-path="' + escapeHtml(data.filePath) + '">\u2717 Reject</button>' +
                    '</div>';

                chatContainer.appendChild(card);
                scrollBottom();

                // File link click - open file
                const fileLink = card.querySelector('.file-link');
                fileLink.addEventListener('click', function(e) {
                    // If Ctrl held, open the file in the editor
                    if (e.ctrlKey || e.metaKey) {
                        vscode.postMessage({
                            command: 'openFileRequest',
                            path: this.dataset.path
                        });
                    }
                });
                fileLink.style.cursor = 'pointer';
                fileLink.title = 'Ctrl+click to open file';

                // Accept button
                const acceptBtn = card.querySelector('.btn-accept');
                acceptBtn.addEventListener('click', function() {
                    vscode.postMessage({
                        command: 'acceptChange',
                        path: this.dataset.path
                    });
                    this.disabled = true;
                    this.textContent = 'Accepted';
                    const rejectBtn = card.querySelector('.btn-reject');
                    if (rejectBtn) { rejectBtn.disabled = true; }
                });

                // Reject button
                const rejectBtn = card.querySelector('.btn-reject');
                rejectBtn.addEventListener('click', function() {
                    vscode.postMessage({
                        command: 'rejectChange',
                        path: this.dataset.path
                    });
                    this.disabled = true;
                    this.textContent = 'Rejected';
                    const acceptBtnCard = card.querySelector('.btn-accept');
                    if (acceptBtnCard) { acceptBtnCard.disabled = true; }
                });
            }

            // ---- Message rendering ----

            function addMessage(role, content) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message ' + role;
                if (role === 'assistant' || role === 'system') {
                    messageDiv.innerHTML = renderMarkdown(content);
                } else {
                    messageDiv.textContent = content;
                }
                chatContainer.appendChild(messageDiv);
                scrollBottom();
                if (role === 'assistant') {
                    attachCopyHandlers(messageDiv);
                }
            }

            function addLoading() {
                const id = 'loading-' + Date.now();
                const div = document.createElement('div');
                div.className = 'message assistant';
                div.id = id;
                div.innerHTML = '<span class="loading"></span>Thinking...';
                chatContainer.appendChild(div);
                scrollBottom();
                return id;
            }

            function removeLoading(id) {
                const el = document.getElementById(id);
                if (el) el.remove();
            }

            // ---- Send message ----

            async function sendMessage() {
                const message = messageInput.value.trim();
                if (!message || isGenerating) return;

                isGenerating = true;
                messageInput.disabled = true;
                sendBtn.disabled = true;
                addMessage('user', message);
                messageInput.value = '';
                const loadingId = addLoading();

                try {
                    const response = await fetch(serverUrl + '/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: defaultModel,
                            messages: [{ role: 'user', content: message }],
                            stream: false
                        })
                    });

                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status + ': ' + response.statusText);
                    }

                    const data = await response.json();
                    removeLoading(loadingId);
                    addMessage('assistant', data.message && data.message.content || data.response || 'No response from Ollama');
                } catch (error) {
                    removeLoading(loadingId);
                    addMessage('system', 'Error: ' + (error.message || error) + '. Make sure Ollama server is running at ' + serverUrl);
                } finally {
                    isGenerating = false;
                    messageInput.disabled = false;
                    sendBtn.disabled = !messageInput.value.trim();
                    messageInput.focus();
                }
            }

            // ---- Event listeners ----

            sendBtn.addEventListener('click', sendMessage);

            messageInput.addEventListener('input', () => {
                sendBtn.disabled = !messageInput.value.trim();
            });

            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            window.addEventListener('message', (event) => {
                const msg = event.data;
                switch (msg.type) {
                    case 'config':
                        if (msg.serverUrl) serverUrl = msg.serverUrl;
                        if (msg.defaultModel) defaultModel = msg.defaultModel;
                        vscode.setState({ serverUrl, defaultModel });
                        break;
                    case 'result':
                        if (msg.text) {
                            addMessage('assistant', msg.text);
                        }
                        break;
                    case 'changeNotification':
                        addChangeNotification(msg);
                        break;
                }
            });
        })();
    </script>
</body>
</html>
